<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Creer un compte - Smart Coach</title>
<meta name="theme-color" content="#18181b">
<link rel="icon" href="/static/icon-192.png" type="image/png">
<script>
  // The viewer's theme and last-seen accent, applied before first paint
  // (no user is known yet; base.html remembers the accent locally).
  (() => {
    try {
      const root = document.documentElement;
      const theme = localStorage.getItem('theme');
      if (theme === 'light' || theme === 'dark') root.setAttribute('data-theme', theme);
      const accent = localStorage.getItem('accent');
      if (accent === 'teal' || accent === 'blue') root.setAttribute('data-accent', accent);
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/theme.css?v={{ theme_version }}">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center px-4">
  <div class="card p-6 w-full max-w-sm" style="box-shadow: 0 10px 30px rgba(0,0,0,0.18);">
    <div class="flex items-center gap-2 mb-6">
      <img src="/static/icon-192.png" width="28" height="28" alt="" style="border-radius: 22%;">
      <span class="font-semibold text-lg">Creer un compte</span>
    </div>

    {% if created %}
    <p class="text-sm mb-4 p-2 rounded-lg" style="background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good);">
      Compte cree. Vous pourrez vous connecter des que l'admin l'aura
      approuve.
    </p>
    {% endif %}
    {% if error %}
    <p class="text-sm mb-4 p-2 rounded-lg" style="background: color-mix(in srgb, var(--critical) 15%, transparent); color: var(--critical);">
      {{ error }}
    </p>
    {% endif %}

    <form method="post" action="/signup" class="space-y-3">
      <label class="block text-sm">
        Utilisateur
        <input name="username" required autofocus maxlength="40"
          class="mt-1 w-full rounded-lg border px-3 py-2 text-sm bg-transparent" style="border-color: var(--border);">
      </label>
      <label class="block text-sm">
        Mot de passe (8 caracteres minimum)
        <input name="password" type="password" required minlength="8"
          class="mt-1 w-full rounded-lg border px-3 py-2 text-sm bg-transparent" style="border-color: var(--border);">
      </label>
      <button type="submit"
        class="btn btn-primary w-full mt-2" style="padding: 0.75rem;">
        Creer le compte
      </button>
    </form>
    <p class="text-xs mt-4" style="color: var(--muted);">
      Deja un compte ? <a href="/login" class="link">Se
      connecter</a>.
    </p>
  </div>
</body>
</html>
