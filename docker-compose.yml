# =============================================================================
#  smart_coach — dashboard + coach
#
#  First run, once (full walkthrough in docs/TECHNICAL.md #Setup) :
#    1. cp .env.example .env  &&  fill TZ, NTFY_TOPIC, RCLONE_REMOTE,
#       SESSION_SECRET
#    2. docker compose run --rm -it smart_coach-worker rclone config
#    3. docker compose run --rm -it -p 8765:8765 \
#           smart_coach-worker python setup_calendar.py <account>
#    4. docker compose run --rm -it smart_coach-worker claude setup-token
#       -> paste the token into .env as CLAUDE_CODE_OAUTH_TOKEN
#    5. docker compose run --rm -it smart_coach-worker python setup_garmin.py <account>
#    6. docker compose up -d --build
# =============================================================================

name: smart_coach

services:
  smart_coach-web:
    build: .
    container_name: smart_coach-web
    command: ["web"]
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ:-Europe/Paris}
    ports:
      # LAN default. For a public deployment bind localhost only
      # (WEB_BIND=127.0.0.1:8080 in .env) and let caddy be the sole
      # entrypoint.
      - "${WEB_BIND:-8080}:8080"
    volumes:
      - ./data/db:/app/data/db
      - ./data/rclone:/root/.config/rclone
      - ./data/gcal-config:/root/.config/smart_coach

  # Public HTTPS front (optional):
  #   docker compose --profile public up -d
  # Needs DOMAIN in .env, DNS pointing here, ports 80/443 forwarded.
  caddy:
    image: caddy:2-alpine
    container_name: smart_coach-caddy
    profiles: ["public"]
    restart: unless-stopped
    depends_on:
      - smart_coach-web
    environment:
      # Required for the public profile -- Caddy refuses to start on
      # the localhost default, which is the failure mode we want.
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data

  smart_coach-worker:
    build: .
    container_name: smart_coach-worker
    command: ["cron-foreground"]
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - ./data/db:/app/data/db
      - ./data/inbox:/app/data/inbox
      - ./data/garmin-tokens:/app/data/garmin-tokens
      - ./data/rclone:/root/.config/rclone
      - ./data/gcal-config:/root/.config/smart_coach
